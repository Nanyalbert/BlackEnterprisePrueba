<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Óptica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

<div class="lens-field" aria-hidden="true">
  <div class="lens-ring r1"></div>
  <div class="lens-ring r2"></div>
  <div class="lens-ring r3"></div>
  <div class="lens-ring r4"></div>
</div>

<div class="stage">

  <div class="brand">
    <img src="assets/img/Logo---Black.png" alt="Black Óptica">
    <div class="brand-copy">
      <h1>Bienvenido</h1>
      <p>Ingresá tus credenciales para continuar</p>
    </div>
  </div>

  <form id="login-form" novalidate>

    <div class="field">
      <label for="email">Usuario</label>
      <div class="field-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6l-10 7L2 6"/><path d="M2 6h20v12H2z"/></svg>
        <input type="email" id="email" name="email" placeholder="nombre@blackoptica.ar" autocomplete="username" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="field-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar contraseña">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="remember">
        Recordarme
      </label>
      <a href="#" class="forgot" id="forgot-link">Olvidé mi contraseña</a>
    </div>

    <div class="error-msg" id="error-msg">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="error-text">Usuario o contraseña incorrectos.</span>
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">
      <div class="spinner"></div>
      <span class="btn-label">Iniciar sesión</span>
    </button>

  </form>

</div>

<footer>&copy; 2026 Black Óptica. Todos los derechos reservados.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>



<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
