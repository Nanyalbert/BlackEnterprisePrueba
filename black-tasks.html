<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Tasks · Black OS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f5f5f5;background:#0c0d0f}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:30px 20px}header,.toolbar,.row,.actions{display:flex;align-items:center;gap:12px}header{justify-content:space-between;margin-bottom:28px}h1{font-size:29px;margin:5px 0}h2{font-size:16px}.muted{color:#92949d;font-size:12px}.mark{font-weight:800;letter-spacing:2px;font-size:12px}.panel{background:#15171a;border:1px solid #303238;border-radius:18px;padding:20px;margin-bottom:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.stat{padding:18px;border:1px solid #303238;border-radius:14px;background:#15171a}.stat b{display:block;font-size:25px}input,select,textarea{font:inherit;color:inherit;background:#101114;border:1px solid #3a3b40;border-radius:10px;padding:12px;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #767a86}button,.link{font:inherit;cursor:pointer;border-radius:10px;padding:11px 15px;background:#eee;color:#141414;border:0;font-weight:700;text-decoration:none}button.secondary,.link{color:#ddd;background:#282a2f}.toolbar{flex-wrap:wrap;margin-bottom:14px}form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px}.task{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #303238;padding:14px 0}.task:last-child{border-bottom:0}.task label{display:flex;align-items:center;gap:12px;flex:1;min-width:0}.task input[type=checkbox]{width:19px;height:19px;accent-color:#e5e5e5;cursor:pointer}.task .name{font-weight:650}.task.completed .name{text-decoration:line-through;color:#83848a}.tag{font-size:11px;color:#b8bbc3;padding:5px 8px;background:#282a2e;border-radius:6px}.detail{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}.danger{color:#ff9a9a}.error{color:#ff9a9a;font-size:13px}.task button{font-size:12px;padding:8px 11px}.hidden{display:none} @media(max-width:780px){form{grid-template-columns:1fr 1fr}form input:first-child{grid-column:span 2}form button{grid-column:span 2}.stats{gap:6px}.stat{padding:12px}.task{align-items:flex-start}.actions{flex-direction:column}header{align-items:flex-start}}</style></head>
<body><main class="shell"><header><div><div class="mark">BLACK OS / ORGANIZACIÓN</div><h1>Black Tasks</h1><div class="muted">Planificá, priorizá y completá tus pendientes.</div></div><a class="link" href="menu.html">← Volver a Black OS</a></header>
<div id="authMessage" class="panel muted">Verificando tu sesión…</div><div id="app" class="hidden"><div class="stats"><div class="stat"><b id="pendingCount">0</b><span class="muted">Pendientes</span></div><div class="stat"><b id="todayCount">0</b><span class="muted">Para hoy</span></div><div class="stat"><b id="doneCount">0</b><span class="muted">Completadas</span></div></div>
<section class="panel"><h2>Nueva tarea</h2><form id="createForm"><input id="title" placeholder="¿Qué tenés que hacer?" maxlength="240" required aria-label="Tarea"><input id="category" placeholder="Categoría" value="General" aria-label="Categoría"><select id="priority" aria-label="Prioridad"><option value="media">Prioridad media</option><option value="alta">Alta</option><option value="urgente">Urgente</option><option value="baja">Baja</option></select><input id="date" type="date" aria-label="Vencimiento"><button type="submit">+ Agregar</button></form><p class="muted">Sin fecha = queda en tu bandeja de pendientes, sin vencimiento automático.</p></section>
<section class="panel"><div class="toolbar"><select id="filter" aria-label="Filtrar"><option value="pending">Pendientes</option><option value="today">Hoy</option><option value="upcoming">Próximas</option><option value="completed">Completadas</option><option value="all">Todas</option></select><input id="search" type="search" placeholder="Buscar tareas…" aria-label="Buscar"><button class="secondary" id="reload" type="button">Actualizar</button></div><div id="feedback" class="error" role="status"></div><div id="list"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/js/supabase-config.js"></script>
<script>
(async()=>{
const byId=id=>document.getElementById(id),client=window.BlackPortal.getSupabase(),{data:{user},error}=await client.auth.getUser();
if(error||!user){byId('authMessage').textContent='Iniciá sesión en Black OS para ver tus tareas.';return;}
byId('authMessage').classList.add('hidden');byId('app').classList.remove('hidden');let tasks=[];
const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=s=>byId('feedback').textContent=s;
async function reload(){msg('');const {data,error}=await client.from('black_tasks').select('id,title,category,priority,status,due_date,notes,created_at').eq('owner_id',user.id).order('created_at',{ascending:false});if(error){msg(error.message);return;}tasks=data||[];render();}
function render(){const today=localDate();byId('pendingCount').textContent=tasks.filter(t=>t.status!=='completada'&&t.status!=='cancelada').length;byId('todayCount').textContent=tasks.filter(t=>t.due_date===today&&t.status!=='completada').length;byId('doneCount').textContent=tasks.filter(t=>t.status==='completada').length;
const term=byId('search').value.trim().toLowerCase(),filter=byId('filter').value;
const subset=tasks.filter(t=>{const done=t.status==='completada',date=t.due_date;return (!term||(t.title+' '+t.category).toLowerCase().includes(term))&&(filter==='all'||filter==='completed'&&done||filter==='pending'&&!done&&t.status!=='cancelada'||filter==='today'&&date===today&&!done||filter==='upcoming'&&date>today&&!done)}).sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999'));
byId('list').innerHTML=subset.length?subset.map(t=>'<div class="task '+(t.status==='completada'?'completed':'')+'" data-id="'+safe(t.id)+'"><label><input type="checkbox" aria-label="Completar tarea" '+(t.status==='completada'?'checked':'')+'><span><span class="name">'+safe(t.title)+'</span><span class="detail"><span class="tag">'+safe(t.category)+'</span><span class="tag">'+safe(t.priority)+'</span><span class="tag">'+safe(t.due_date||'Sin fecha')+'</span></span></span></label><div class="actions"><button class="secondary" data-action="date" type="button">Fecha</button><button class="secondary" data-action="delete" type="button">Eliminar</button></div></div>').join(''):'<p class="muted">No hay tareas para este filtro.</p>'}
byId('createForm').addEventListener('submit',async e=>{e.preventDefault();const title=byId('title').value.trim();if(!title)return;const row={owner_id:user.id,title,category:byId('category').value.trim()||'General',priority:byId('priority').value,due_date:byId('date').value||null,source:'black_os'};const{error}=await client.from('black_tasks').insert(row);if(error){msg(error.message);return;}byId('title').value='';byId('date').value='';await reload()});
byId('list').addEventListener('change',async e=>{if(e.target.type!=='checkbox')return;const id=e.target.closest('[data-id]')?.dataset.id;const done=e.target.checked;const{error}=await client.from('black_tasks').update({status:done?'completada':'pendiente',completed_at:done?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id).eq('owner_id',user.id);if(error)msg(error.message);await reload()});
byId('list').addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const id=btn.closest('[data-id]').dataset.id;if(btn.dataset.action==='delete'&&!confirm('¿Eliminar esta tarea?'))return;let payload;if(btn.dataset.action==='date'){const current=tasks.find(t=>t.id===id)?.due_date||'';const date=prompt('Fecha YYYY-MM-DD (vacío para quitar):',current);if(date===null)return;if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date)){msg('Fecha inválida');return;}payload={due_date:date||null,updated_at:new Date().toISOString()};}const request=btn.dataset.action==='delete'?client.from('black_tasks').delete().eq('id',id).eq('owner_id',user.id):client.from('black_tasks').update(payload).eq('id',id).eq('owner_id',user.id);const{error}=await request;if(error)msg(error.message);await reload()});
byId('filter').addEventListener('change',render);byId('search').addEventListener('input',render);byId('reload').addEventListener('click',reload);await reload();
})().catch(e=>{document.getElementById('authMessage').textContent='Error al cargar Black Tasks: '+e.message});
</script></body></html>
