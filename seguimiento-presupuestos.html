<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Óptica — Seguimiento de presupuestos</title><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script><style>body{margin:0;background:#0b0b0b;color:#f4f4f1;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.top{display:flex;gap:12px;align-items:center}.back{background:#151515;border:1px solid #2b2b2b;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}h1{font-size:30px;margin:22px 0 6px}.sub{color:#999;font-size:13px;max-width:760px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.card{background:#121212;border:1px solid #292929;border-radius:14px;padding:16px}.card h3{font-size:13px;margin-top:0}.file{width:100%;color:#aaa}.actions{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.btn{background:#f4f4f1;color:#111;border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.35}.msg{width:100%;min-height:76px;background:#171717;color:#eee;border:1px solid #303030;border-radius:10px;padding:10px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{background:#121212;border:1px solid #292929;border-radius:12px;padding:13px}.stat b{font-size:22px;display:block}.stat span{font-size:10px;color:#999}.table-wrap{overflow:auto;border:1px solid #292929;border-radius:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 12px;border-bottom:1px solid #242424;text-align:left;font-size:12px}.table th{color:#999;font-size:10px;text-transform:uppercase}.pill{display:inline-block;border-radius:999px;padding:5px 8px;background:#1c1c1c;color:#bbb}.copy{background:#1b2a22;color:#76d69f;border:1px solid #294737;border-radius:8px;padding:7px 9px;cursor:pointer}.error{color:#ef7770;font-size:12px;margin-top:10px}@media(max-width:800px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='crm-clientes.html'">← Volver al CRM</button></div><h1>Seguimiento de presupuestos</h1><div class="sub">Cruza Clientes + Presupuestos y, opcionalmente, Recetas. Deja afuera a quienes ya confirmaron o ya tienen receta y genera la lista operativa de personas que todavía conviene contactar.</div><div class="grid"><div class="card"><h3>Clientes</h3><input class="file" type="file" id="clientes" accept=".csv"></div><div class="card"><h3>Presupuestos</h3><input class="file" type="file" id="presupuestos" accept=".csv"></div><div class="card"><h3>Recetas · opcional</h3><input class="file" type="file" id="recetas" accept=".csv"></div></div><textarea class="msg" id="plantilla">Hola {nombre}, ¿cómo estás? Te escribía para saber si pudiste revisar el presupuesto que te hicimos. Cualquier consulta quedo a disposición. Saludos!</textarea><div class="actions"><button class="btn" id="procesar" disabled>Procesar seguimiento</button></div><div class="error" id="error"></div><div id="salida" style="display:none"><div class="stats" id="stats"></div><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Teléfono</th><th>Presupuestos</th><th>Mensaje</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div><script>let tc='',tp='',tr='';const $=x=>document.getElementById(x);function clean(t){const a=t.split(/\r?\n/);if(/^sep\s*=/i.test(a[0]||''))a.shift();return Papa.parse(a.join('\n'),{header:true,delimiter:';',skipEmptyLines:true,transformHeader:h=>h.trim()}).data}const n=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[.,]/g,' ').replace(/\s+/g,' ').trim();const tok=s=>[...new Set(n(s).split(' ').filter(Boolean))].sort().join(' ');const ph=s=>(s||'').toString().replace(/\D/g,'');function col(r,c){const k=Object.keys(r||{});for(const x of c){const h=k.find(q=>n(q)===n(x));if(h)return h}for(const x of c){const h=k.find(q=>n(q).includes(n(x)));if(h)return h}return null}async function read(i,set){i.onchange=async e=>{const f=e.target.files[0];if(f){set(await f.text());$('procesar').disabled=!(tc&&tp)}}}read($('clientes'),v=>tc=v);read($('presupuestos'),v=>tp=v);read($('recetas'),v=>tr=v);function idx(rows){const a=col(rows[0],['Nombre']),b=col(rows[0],['RazonSocial/Apellido','RazonSocial','Apellido']),p=col(rows[0],['Celular','Telefono','Teléfono']);if(!p)throw Error('Clientes: no encuentro la columna de teléfono.');const e={},t={};for(const r of rows){const tel=ph(r[p]);if(!tel)continue;for(const z of [a&&r[a],b&&r[b]])if(z){e[n(z)]??=tel;t[tok(z)]??=tel}}return x=>e[n(x)]||t[tok(x)]||''}$('procesar').onclick=()=>{try{$('error').textContent='';const c=clean(tc),p=clean(tp);const cc=col(p[0],['Cliente']),ce=col(p[0],['Confirmado?','Confirmado','Estado']);if(!cc||!ce)throw Error('Presupuestos: faltan Cliente y Confirmado?/Estado.');const find=idx(c),rx=new Set(),rt=new Set();if(tr){const rr=clean(tr),rc=rr.length&&col(rr[0],['Cliente']);if(rr.length&&!rc)throw Error('Recetas: no encuentro Cliente.');for(const r of rr){const x=r[rc];if(x){rx.add(n(x));rt.add(tok(x))}}}const g={};for(const r of p){const x=r[cc];if(!x)continue;const k=n(x);g[k]??={name:x,count:0,ok:false};g[k].count++;if(['SI','S','CONFIRMADO','YES','TRUE'].includes(n(r[ce])))g[k].ok=true}let conf=0,rec=0,out=[];for(const x of Object.values(g)){if(x.ok){conf++;continue}if(rx.has(n(x.name))||rt.has(tok(x.name))){rec++;continue}const tel=find(x.name);out.push({name:x.name,tel,count:x.count})}const tpl=$('plantilla').value;$('tbody').innerHTML=out.map((x,i)=>{const first=(x.name||'').trim().split(/\s+/)[0]||'';const msg=tpl.replace(/\{nombre\}/gi,first);return `<tr><td>${x.name}</td><td>${x.tel||'—'}</td><td>${x.count}</td><td><button class="copy" onclick="navigator.clipboard.writeText(${JSON.stringify(msg)});this.textContent='Copiado ✓'">Copiar mensaje</button></td></tr>`}).join('');$('stats').innerHTML=`<div class="stat"><b>${Object.keys(g).length}</b><span>En presupuestos</span></div><div class="stat"><b>${conf}</b><span>Confirmados</span></div><div class="stat"><b>${rec}</b><span>Con receta</span></div><div class="stat"><b>${out.length}</b><span>Pendientes</span></div>`;$('salida').style.display='block'}catch(e){$('error').textContent=e.message}};</script></body></html>
