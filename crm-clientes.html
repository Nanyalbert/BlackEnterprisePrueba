<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Black Óptica — CRM Black</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;background:#080808;overflow:hidden;font-family:Arial,sans-serif}
  .crm-stage{position:fixed;inset:0;background:#080808}
  #crmFrame{display:block;width:100%;height:100%;border:0;background:#080808}
  .crm-nav-wrap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:1000;width:min(760px,calc(100vw - 28px));pointer-events:none}
  .crm-nav{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;background:rgba(16,16,16,.96);border:1px solid #2b2b2b;border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.45);backdrop-filter:blur(14px);overflow-x:auto;scrollbar-width:none}
  .crm-nav::-webkit-scrollbar{display:none}
  .crm-nav-btn{appearance:none;border:0;background:transparent;color:#a8a8a8;display:flex;align-items:center;gap:9px;justify-content:center;min-width:max-content;padding:12px 15px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:.16s ease;white-space:nowrap}
  .crm-nav-btn:hover{color:#f4f4f4;background:#191919}
  .crm-nav-btn.active{background:#f6f6f4;color:#111}
  .crm-nav-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .crm-nav-btn.ai-btn svg{stroke-width:1.6}
  @media(max-width:720px){.crm-nav-wrap{bottom:10px;width:calc(100vw - 16px)}.crm-nav{justify-content:flex-start;padding:6px}.crm-nav-btn{padding:10px 12px;font-size:12px;gap:7px}}
</style>
</head>
<body>
<div class="crm-stage"><iframe id="crmFrame" src="crm-clientes-core.html" title="CRM Black"></iframe></div>
<div class="crm-nav-wrap">
  <nav class="crm-nav" aria-label="Navegación CRM Black">
    <button class="crm-nav-btn active" data-section="inicio" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9 21v-6h6v6"/></svg><span>Inicio</span>
    </button>
    <button class="crm-nav-btn" data-section="clientes" type="button">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20v-1.5A4.5 4.5 0 0 1 8 14h2a4.5 4.5 0 0 1 4.5 4.5V20"/><path d="M16 6.5a3 3 0 0 1 0 5.5M17 14a4.5 4.5 0 0 1 3.5 4.4V20"/></svg><span>Clientes</span>
    </button>
    <button class="crm-nav-btn" data-section="campanas" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 13h3l9 5V6l-9 5H4z"/><path d="M7 13v5"/><path d="M19 9a5 5 0 0 1 0 6"/></svg><span>Campañas</span>
    </button>
    <button class="crm-nav-btn" data-section="presupuestos" type="button">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h4"/></svg><span>Presupuestos</span>
    </button>
    <button class="crm-nav-btn" data-section="automatizaciones" type="button">
      <svg viewBox="0 0 24 24"><path d="m13 2-8 11h6l-1 9 9-12h-6z"/></svg><span>Automatizaciones</span>
    </button>
    <button class="crm-nav-btn ai-btn" data-section="ia" type="button">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="4"/><path d="M9 10h.01M15 10h.01M9 14c.9.7 1.9 1 3 1s2.1-.3 3-1M12 2v3"/></svg><span>IA</span>
    </button>
  </nav>
</div>
<script>
const frame=document.getElementById('crmFrame');
const buttons=[...document.querySelectorAll('.crm-nav-btn')];
let currentSection='inicio';
let pendingView='hoy';

function setActive(section){
  currentSection=section;
  buttons.forEach(btn=>btn.classList.toggle('active',btn.dataset.section===section));
}

function prepareCore(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    if(!doc.getElementById('black-crm-shell-hide-legacy')){
      const style=doc.createElement('style');
      style.id='black-crm-shell-hide-legacy';
      style.textContent='.bottom-nav{display:none!important}.content{padding-bottom:105px!important}.fab{bottom:104px!important}';
      doc.head.appendChild(style);
    }
    if(pendingView && typeof frame.contentWindow.setView==='function'){
      const map={hoy:'nav-hoy',todos:'nav-todos',tablero:'nav-tablero',campanas:'nav-campanas-hidden'};
      const innerBtn=doc.getElementById(map[pendingView])||doc.createElement('button');
      frame.contentWindow.setView(pendingView,innerBtn);
      pendingView=null;
    }
  }catch(error){console.warn('CRM shell:',error)}
}

function openCore(view){
  pendingView=view;
  const src=(frame.getAttribute('src')||'').split('?')[0];
  if(src!=='crm-clientes-core.html'){
    frame.src='crm-clientes-core.html';
  }else{
    prepareCore();
  }
}

function navigate(section){
  setActive(section);
  if(section==='inicio')return openCore('hoy');
  if(section==='clientes')return openCore('todos');
  if(section==='campanas')return openCore('campanas');
  if(section==='presupuestos')return openCore('tablero');
  if(section==='automatizaciones'){pendingView=null;frame.src='automatizaciones-postventa.html';return;}
  if(section==='ia'){pendingView=null;frame.src='black-ai.html';return;}
}

buttons.forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.section)));
frame.addEventListener('load',()=>{
  if((frame.getAttribute('src')||'').startsWith('crm-clientes-core.html'))prepareCore();
});
</script>
</body>
</html>
